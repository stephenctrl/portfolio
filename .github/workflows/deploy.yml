name: Deploy Portfolio

on:
  # 1. STRICT TRIGGER: Only run when code is pushed to main
  push:
    branches: ["main"]
  # Allow manual runs from the GitHub UI
  workflow_dispatch:

# 2. PERMISSIONS: Required for native GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# 3. CONCURRENCY: Kills the loop by canceling older overlapping runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Generates projects.json strictly in the CI environment (does NOT commit it)
      - name: Fetch GitHub Data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: npx tsx scripts/fetch-repos.ts

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4